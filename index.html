<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Birds MC – Clothing</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d0d0d;
  color: #f5f5f5;
}

header {
  padding: 24px 18px;
  background: #161616;
  border-bottom: 2px solid #555;
  text-align: center;
}

header h2 {.club-logo {
  width: 50px;
  max-width: 18vw;
  height: auto;
  display: block;
  margin: 0 auto 8px auto;
  object-fit: contain;
}
  margin: 0;
  font-size: 28px;
  letter-spacing: 1px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #181818;
  border: 1px solid #444;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

.hidden {
  display: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
}

.product {
  background: #1b1b1b;
  border: 1px solid #444;
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
  .product h4 {
  margin: 0;
  font-size: 20px;
}

.product p {
  margin: 0;
}

.product select,
.product input {
  width: 100%;
  min-height: 46px;
}

.product button {
  width: 100%;
  min-height: 48px;
  margin-top: 4px;
}

.product .muted {
  min-height: 20px;
}

.product:hover {
  transform: translateY(-3px);
  border-color: #888;
}

button,
input,
select {
  font: inherit;
  padding: 11px 14px;
  border-radius: 9px;
  border: 1px solid #555;
}

input,
select {
  background: #f5f5f5;
  color: #111;
}

button {
  background: #eeeeee;
  color: #111;
  cursor: pointer;
  font-weight: bold;
  border: none;
}

button:hover {
  background: #ffffff;
}

.muted {
  color: #aaa;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

#shop h3 {
  font-size: 24px;
}

#cartTotal {
  font-size: 20px;
}

@media (max-width: 600px) {
#login {
  padding: 18px;
  max-width: 360px;
  margin-left: auto;
  margin-right: auto;
}
  .product {
  padding: 16px;
}

.product h4 {
  font-size: 19px;
}

#login h3 {
  margin: 0 0 15px 0;
}

#login select,
#login input,
#login button {
  display: block;
  width: 100%;
  margin: 0 0 12px 0;
  min-height: 48px;
}

#login button {
  margin-bottom: 0;
}
  .club-logo {
    width: 90px;
    max-width: 28vw;
    }
  header h2 {
    font-size: 21px;
  }

  main {
    padding: 12px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .product {
    padding: 16px;
  }

  button {
    min-height: 44px;
  }
}
.product-image {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: contain;
  background: #111;
  border-radius: 12px;
  border: 1px solid #333;
}

.product-image.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  font-size: 14px;
}
</style>
</head>
<body>
<header>
  <img src="logo.jpeg" alt="Power Birds MC Logo" class="club-logo">
  <h2>Clothing Shop</h2>
</header>
<main>
<div id="config" class="card hidden">
<b>Supabase noch nicht eingetragen.</b><br>
Ersetze im Code die beiden Platzhalter SUPABASE_URL und SUPABASE_KEY.
</div>

<section id="login" class="card">
<h3>Login</h3>
<select id="memberSelect"><option>Lade Mitglieder…</option></select>
<input id="pin" type="password" inputmode="numeric" placeholder="PIN">
<button onclick="login()">Anmelden</button>
<div id="loginMsg"></div>
</section>
<section id="admin" class="hidden card">
  <h3>⚙️ Admin-Bereich</h3>
  <p>Artikel verwalten</p>

  <div id="adminProducts"></div>

  <button onclick="showShop()">Zurück zum Shop</button>
</section>
<section id="shop" class="hidden">
<div class="card row"><span>Angemeldet als <b id="memberName"></b></span><button onclick="logout()">Abmelden</button></div>
<button id="adminBtn" class="hidden" onclick="showAdmin()">⚙️ Admin-Bereich</button>
<h3>Shop</h3>
<div id="products" class="grid"></div>
<div class="card"><button onclick="showCart()">🛒 Warenkorb (<span id="cartCount">0</span>)</button></div>
</section>

<section id="cart" class="hidden card">
<h3>Warenkorb</h3>
<div id="cartItems"></div>
<p><b>Gesamt: <span id="cartTotal">0,00 €</span></b></p>
<button onclick="showShop()">Zurück</button>
<button onclick="placeOrder()">Bestellung abschicken</button>
<div id="orderMsg"></div>
</section>

<section id="orders" class="hidden card">
<h3>Meine Bestellungen</h3>
<div id="ordersList"></div>
<button onclick="showShop()">Zurück zum Shop</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://sxnjdetcxkmyeanivmbf.supabase.co";
const SUPABASE_KEY = "sb_publishable_G9i_BbsW0MNB_QrbbvsEsw_OwsLhiaC";

let db=null,currentMember=null,currentPin="",products=[],sizes=[],colors=[],cart=[];
function configured(){
  return SUPABASE_URL.startsWith("https://") &&
         !SUPABASE_URL.includes("PASTE_") &&
         SUPABASE_KEY.length>20 &&
         !SUPABASE_KEY.includes("PASTE_");
}
function money(v){return Number(v||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"})}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

async function init(){
  if(!configured()){document.getElementById("config").classList.remove("hidden");return}
  db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data,error}=await db.rpc("get_active_members");
  if(error){document.getElementById("loginMsg").textContent=error.message;return}
  const s=document.getElementById("memberSelect"); s.innerHTML="";
  data.forEach(m=>{
  const o=document.createElement("option");
  o.value=m.id;
  o.textContent=m.name;
  o.dataset.admin=m.is_admin ? "true" : "false";
  s.appendChild(o);
})
}
async function login(){
  const id=Number(document.getElementById("memberSelect").value);
  const pin=document.getElementById("pin").value.trim();
  const {data,error}=await db.rpc("verify_member_login",{p_member_id:id,p_pin:pin});
  if(error||data!==true){document.getElementById("loginMsg").textContent="Name oder PIN falsch";return}
  currentMember={
  id,
  name:document.getElementById("memberSelect").selectedOptions[0].textContent,
  is_admin:document.getElementById("memberSelect").selectedOptions[0].dataset.admin==="true"
};
  currentPin=pin; document.getElementById("memberName").textContent=currentMember.name;
  document.getElementById("adminBtn").classList.toggle("hidden", !currentMember.is_admin);
  document.getElementById("login").classList.add("hidden"); document.getElementById("shop").classList.remove("hidden");
  await loadShop();
}
async function loadShop(){
 const [{data:p},{data:s},{data:c}]=await Promise.all([
  db.from("products").select("id,name,description,price,image_url").eq("active",true).order("id"),
  db.from("product_sizes").select("product_id,size").order("id"),
  db.from("product_colors").select("product_id,color").order("id")
]);

products=p||[];
sizes=s||[];
colors=c||[];

renderProducts();
}
function renderProducts(){
  const el=document.getElementById("products"); el.innerHTML="";
  products.forEach(p=>{
    const opts=sizes.filter(s=>s.product_id===p.id).map(s=>`<option>${esc(s.size)}</option>`).join("");
    const colorOpts=colors
  .filter(c=>c.product_id===p.id)
  .map(c=>`<option>${esc(c.color)}</option>`)
  .join("");
    const imageHtml = p.image_url
  ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" class="product-image">`
  : `<div class="product-image placeholder">Kein Bild vorhanden</div>`;

el.innerHTML+=`
<div class="product">
  ${imageHtml}
  <h4>${esc(p.name)}</h4>
  <p class="muted">${esc(p.description||"")}</p>
  <p><b>${money(p.price)}</b></p>
  <select id="s${p.id}">${opts}</select>
  <select id="c${p.id}">${colorOpts}</select>
  <input id="q${p.id}" type="number" min="1" max="50" value="1">
  <button onclick="add(${p.id})">In den Warenkorb</button>
</div>`;
  });
}
function add(id){
  const p=products.find(x=>x.id===id);
const size=document.getElementById("s"+id).value;
const color=document.getElementById("c"+id)?.value || "";
const quantity=Math.max(1,Math.min(50,parseInt(document.getElementById("q"+id).value||1)));
  cart.push({
  product_id:id,
  name:p.name,
  price:Number(p.price),
  size,
  color,
  quantity
});
  document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.quantity,0);
}
function showCart(){
  document.getElementById("shop").classList.add("hidden");document.getElementById("cart").classList.remove("hidden");
  const el=document.getElementById("cartItems"); el.innerHTML=""; let total=0;
  cart.forEach((x,i)=>{total+=x.price*x.quantity;el.innerHTML+=`<p>${x.quantity}× ${esc(x.name)} · ${esc(x.size)} · ${esc(x.color)} · ${money(x.price*x.quantity)} <button onclick="rem(${i})">Entfernen</button></p>`});
  document.getElementById("cartTotal").textContent=money(total);
}
function rem(i){cart.splice(i,1);showCart();document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.quantity,0)}
function showShop(){document.getElementById("cart").classList.add("hidden");document.getElementById("orders").classList.add("hidden");document.getElementById("shop").classList.remove("hidden")}
async function showAdmin(){
  if(!currentMember || !currentMember.is_admin){
    alert("Kein Admin-Zugriff.");
    return;
  }

  document.getElementById("shop").classList.add("hidden");
  document.getElementById("cart").classList.add("hidden");
  document.getElementById("orders").classList.add("hidden");
  document.getElementById("admin").classList.remove("hidden");

  await renderAdminProducts();
}
  async function renderAdminProducts(){
  const el = document.getElementById("adminProducts");
  el.innerHTML = "Lade Artikel…";

  const {data,error} = await db
    .from("products")
    .select("id,name,description,price,image_url,active")
    .order("id");

  if(error){
    el.innerHTML = "Fehler beim Laden: " + esc(error.message);
    return;
  }

  el.innerHTML = data.map(p => `
    <div class="card">
      <label>Artikelname</label>
      <input id="admin-name-${p.id}" value="${esc(p.name)}">

      <br><br>

      <label>Beschreibung</label>
      <input id="admin-desc-${p.id}" value="${esc(p.description || "")}">

      <br><br>

      <label>Preis</label>
      <input id="admin-price-${p.id}" type="number" step="0.01" value="${p.price}">

      <br><br>

      <label>Bild auswählen</label>
<input id="admin-image-file-${p.id}" type="file" accept="image/*">
<input id="admin-image-${p.id}" type="hidden" value="${esc(p.image_url || "")}">
      <br><br>

      <button onclick="saveAdminProduct(${p.id})">
        Speichern
      </button>
    </div>
  `).join("");
}
  async function saveAdminProduct(id){
  if(!currentMember || !currentMember.is_admin){
    alert("Kein Admin-Zugriff.");
    return;
  }
    const fileInput = document.getElementById(`admin-image-file-${id}`);
const file = fileInput?.files?.[0];

if(file){
  const formData = new FormData();
  formData.append("member_id", currentMember.id);
  formData.append("pin", currentPin);
  formData.append("file", file);

  const response = await fetch(
    `${SUPABASE_URL}/functions/v1/admin-image-upload`,
    {
      method: "POST",
      headers: {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`
},
      body: formData
    }
  );

  const result = await response.json();

  if(!response.ok || !result.success){
    alert("Bild-Upload fehlgeschlagen: " + (result.error || "Unbekannter Fehler"));
    return;
  }

  document.getElementById(`admin-image-${id}`).value = result.url;
}

  const name = document.getElementById(`admin-name-${id}`).value.trim();
  const description = document.getElementById(`admin-desc-${id}`).value.trim();
  const price = Number(document.getElementById(`admin-price-${id}`).value);
  const image_url = document.getElementById(`admin-image-${id}`).value.trim();

  if(!name){
    alert("Bitte einen Artikelnamen eingeben.");
    return;
  }

  if(Number.isNaN(price) || price < 0){
    alert("Bitte einen gültigen Preis eingeben.");
    return;
  }

  const {error} = await db.rpc("admin_update_product", {
  p_member_id: currentMember.id,
  p_pin: currentPin,
  p_product_id: id,
  p_name: name,
  p_description: description,
  p_price: price,
  p_image_url: image_url
});

  if(error){
    alert("Speichern fehlgeschlagen: " + error.message);
    return;
  }

  alert("Artikel gespeichert ✅");

  await loadShop();
  await renderAdminProducts();
}
 
async function placeOrder(){
  if(!cart.length){document.getElementById("orderMsg").textContent="Warenkorb ist leer";return}
const items=cart.map(x=>({
  product_id:x.product_id,
  size:x.size,
  color:x.color,
  quantity:x.quantity
}));
  const {data,error}=await db.rpc("create_clothing_order",{p_member_id:currentMember.id,p_pin:currentPin,p_items:items});
  if(error){document.getElementById("orderMsg").textContent=error.message;return}
  cart=[];document.getElementById("cartCount").textContent="0";await loadOrders();
}
async function loadOrders(){
  const {data,error}=await db.rpc("get_member_orders",{p_member_id:currentMember.id,p_pin:currentPin});
  if(error){document.getElementById("ordersList").textContent=error.message;return}
  document.getElementById("cart").classList.add("hidden");document.getElementById("shop").classList.add("hidden");document.getElementById("orders").classList.remove("hidden");
  const grouped={}; (data||[]).forEach(r=>{if(!grouped[r.order_id])grouped[r.order_id]={...r,items:[]};grouped[r.order_id].items.push(r)});
  document.getElementById("ordersList").innerHTML=Object.values(grouped).map(o=>`<div><b>Bestellung #${o.order_id}</b> · ${esc(o.status)}<br>${o.items.map(x=>`${x.quantity}× ${esc(x.product_name)} (${esc(x.size)})`).join("<br>")}<p><b>${money(o.total)}</b></p><hr></div>`).join("");
}
function logout(){location.reload()}
init();
</script>
</body>
</html>
